[project]
name = "code29-backend"
version = "0.1.0"
description = "Code29 FastAPI backend (scaffolding + healthcheck)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "genkit>=0.9.0",
    "genkit-google-genai>=0.9.0",
    "genkit-fastapi>=0.9.0",
    "genkit-openai>=0.9.0",
    "genkit-anthropic>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
